[project]
name = "clima-costero"
version = "1.0.0"
description = "API de condiciones costeras de Rocha con FastAPI y Open-Meteo"
authors = [{ name = "Matías Nicolás Echeveste Cardozo" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["estatico/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
